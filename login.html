<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Title & Description -->
  <title>Login | GhBooster - #1 SMM Panel</title>
  <meta name="description" content="Log in to your GhBooster account to access instant SMM panel services, track orders, and manage your balance.">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="src/css/style.css">
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/src/img/favicon.png?v=5">
  <link rel="icon" type="image/png" sizes="192x192" href="/src/img/favicon.png?v=5">
  <link rel="apple-touch-icon" sizes="180x180" href="/src/img/favicon.png?v=5">
  <link rel="shortcut icon" href="/favicon.ico?v=5">
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between dark:bg-gray-900 dark:text-gray-100 transition-colors duration-200">

  <!-- Login Form Container -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 transition-colors duration-200">
      <div class="text-center mb-6">
        <a href="/" class="inline-flex items-center justify-center py-2">
        <img src="/src/img/logo.png?v=4" alt="GhBooster Logo" class="h-12 w-auto object-contain">
      </a>
      </div>

      <!-- Alert Notification Banner -->
      <div id="login-alert" class="hidden p-3.5 rounded-xl text-xs font-semibold mb-5 bg-red-50 text-red-700 dark:bg-red-900/30 dark:text-red-300 border border-red-200 dark:border-red-800/50 flex items-center space-x-2" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span id="login-alert-text">Invalid login credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="login-form" action="#" method="POST" class="space-y-5">
        <!-- Email / Username Address -->
        <div>
          <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">Email Address or Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 dark:text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
            </div>
            <input type="text" id="email" name="email" required placeholder="john@example.com" class="w-full pl-11 pr-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white text-sm focus:outline-none focus:border-pink-600 focus:bg-white dark:focus:bg-gray-900 transition">
          </div>
          <p class="error-msg text-xs text-red-500 dark:text-red-400 font-medium mt-1 hidden" id="email-error">Please enter your email or username.</p>
        </div>

        <!-- Password -->
        <div>
          <div class="flex justify-between items-center mb-2">
            <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Password</label>
            <a href="#" id="forgot-password-link" class="text-xs font-semibold text-pink-600 dark:text-pink-400 hover:text-pink-700 dark:hover:text-pink-300">Forgot password?</a>
          </div>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 dark:text-gray-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full pl-11 pr-11 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white text-sm focus:outline-none focus:border-pink-600 focus:bg-white dark:focus:bg-gray-900 transition">
            <button type="button" id="toggle-password-btn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 focus:outline-none" aria-label="Toggle password visibility">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-closed" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 eye-open hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.962 8.962 0 012.122-.063c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18" />
              </svg>
            </button>
          </div>
          <p class="error-msg text-xs text-red-500 dark:text-red-400 font-medium mt-1 hidden" id="password-error">Please enter your password.</p>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center justify-between">
          <label class="flex items-center cursor-pointer">
            <input type="checkbox" name="remember" class="w-4 h-4 text-pink-600 border-gray-300 dark:border-gray-700 rounded focus:ring-pink-500 cursor-pointer">
            <span class="ml-2 text-sm text-gray-600 dark:text-gray-400">Remember me for 30 days</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="login-submit-btn" class="w-full py-3.5 px-4 bg-pink-600 hover:bg-pink-700 text-white font-bold text-sm rounded-xl shadow-lg hover:shadow-pink-600/30 transform transition duration-200 active:scale-95 flex items-center justify-center space-x-2">
          <span>Sign In to GhBooster</span>
        </button>
      </form>

      <!-- Switch to Register Link -->
      <div class="mt-6 pt-6 border-t border-gray-100 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
        Don't have an account? 
        <a href="/register" class="font-bold text-pink-600 dark:text-pink-400 hover:text-pink-700 dark:hover:text-pink-300 ml-1">Create Account</a>
      </div>

      <!-- Footer Note -->
      <div class="mt-4 text-center text-xs text-gray-400 dark:text-gray-500">
        By logging in, you agree to GhBooster's 
        <a href="/terms" class="underline hover:text-gray-600 dark:hover:text-gray-300">Terms of Service</a> and 
        <a href="/terms" class="underline hover:text-gray-600 dark:hover:text-gray-300">Privacy Policy</a>.
      </div>
    </div>
  </main>

  <!-- Footer Copyright -->
  <footer class="py-6 bg-white dark:bg-gray-800 border-t border-gray-100 dark:border-gray-700 text-center text-sm text-gray-500 dark:text-gray-400">
    Copyright © GhBooster | All rights reserved.
  </footer>

  <script src="src/js/theme.js"></script>
  <script src="src/js/api-client.js"></script>

</body>
</html>
